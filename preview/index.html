<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F1 Paddock · Prueba de sesión</title><style>body{margin:0;background:#101214;color:#edf2fa;font-family:Arial,sans-serif}header{padding:16px 28px;border-bottom:1px solid #ffffff16;color:#a8b8cb;font-size:12px;display:flex;justify-content:space-between;gap:12px}header strong{color:#fff}main{max-width:1650px;margin:24px auto;padding:0 24px}button{color:inherit;background:#1d2b38;border:1px solid #ffffff30;border-radius:6px;padding:8px;cursor:pointer}@media(max-width:650px){header{display:block;line-height:1.8}main{padding:0 12px;margin-top:12px}}@font-face{font-family:F1Paddock;src:url("/preview-assets/Formula1-Bold.woff") format("woff");font-display:swap}</style></head><body><header><span><strong>GOG23 Software Studio · F1 Paddock</strong> · 0.1.5</span><span>Muestra real capturada · No es una sesión en directo</span></header><main><f1-paddock-card></f1-paddock-card></main><script type="module">
import '/component/f1-paddock-card.js?v=0.1.5';
const params=new URLSearchParams(location.search);
const language=params.get('language')==='en'?'en':'es';
const sample=params.get('sample');
const snapshot=await(await fetch(sample==='en'||sample==='es'?`/snapshot-${sample}.json`:'/snapshot.json')).json();
const favoriteId=params.get('driver')||'alonso';
const favoriteDriver=snapshot.drivers.find(d=>d.id===favoriteId)||snapshot.drivers.find(d=>d.id==='alonso');
document.documentElement.lang=language;
document.querySelector('header span:last-child').textContent=language==='en'?'Dated historical sample · Not a live session':'Muestra histórica fechada · No es una sesión en directo';
if(params.has('simulation')){
 document.querySelector('header span:last-child').textContent=language==='en'?'SIMULATION · Fictional data · No Home Assistant connection':'SIMULACIÓN · Datos inventados · Sin conexión a Home Assistant';
 if(params.has('focus')){
  const rows=snapshot.timing.rows||snapshot.drivers.map(d=>({...d,number:String(d.number)})),driver=rows.find(d=>d.id===favoriteDriver.id);
  if(driver)snapshot.timing.rows=[rows.find(d=>d.id!==driver.id),driver,...rows.filter(d=>d.id!==driver.id).slice(1)];
 }
}
const entity='sensor.f1_paddock_dashboard',favorite='select.f1_paddock_favorite_driver',round='select.f1_paddock_result_gp';
let card=document.querySelector('f1-paddock-card');
if(params.has('independent')){const replacement=document.createElement('f1-paddock-calendar-card');card.replaceWith(replacement);card=replacement;}
const states={
 [entity]:{entity_id:entity,state:snapshot.event?.name||'season_finished',attributes:{snapshot,favorite_id:favoriteDriver.id,favorite_entity:favorite,round_entity:round,friendly_name:'F1 Paddock Dashboard'}},
 [favorite]:{entity_id:favorite,state:favoriteDriver.name,attributes:{options:snapshot.drivers.map(d=>d.name)}},
 [round]:{entity_id:round,state:`R${snapshot.result_round} · ${snapshot.calendar.find(c=>c.round===snapshot.result_round).name}`,attributes:{options:snapshot.calendar.map(c=>`R${c.round} · ${c.name}`)}}
};
const hass={language,states,async callService(domain,action,data){if(data.entity_id===favorite){states[favorite]={...states[favorite],state:data.option};states[entity]={...states[entity],attributes:{...states[entity].attributes,favorite_id:snapshot.drivers.find(d=>d.name===data.option).id}};}else{throw new Error(language==='en'?'This preview only includes the captured GP.':'La vista previa solo incluye los resultados del GP capturado.');}card.hass=hass;}};
const previewConfig={entity,type:params.has('independent')?'custom:f1-paddock-calendar-card':'custom:f1-paddock-card',...(!params.has('independent')?{card_type:params.has('simulation')?'simulation':'dashboard'}:{}),language:params.get("language")||"auto",table_height:430};
card.setConfig(previewConfig);card.hass=hass;
if(params.has('editor')){
 const editor=document.createElement('f1-paddock-card-editor');
 editor.style.cssText='display:block;max-width:620px;margin:0 auto 24px;padding:20px;background:#182430;border-radius:18px';
 document.querySelector('main').prepend(editor);editor.setConfig(previewConfig);editor.hass=hass;
 editor.addEventListener('config-changed',ev=>card.setConfig(ev.detail.config));
 if(params.has('updates')){
  const status=document.createElement('p');status.setAttribute('role','status');status.textContent='Local editor checks · 0 HA-like updates';editor.before(status);
  let ticks=0;const timer=setInterval(()=>{ticks++;status.textContent=`Local editor checks · ${ticks} HA-like updates`;
   editor.hass={...hass,states:{...states,'sensor.preview_tick':{state:String(ticks),attributes:{}}}};
   editor.setConfig({...editor._config});if(ticks===30)clearInterval(timer);
  },1000);window.addEventListener('pagehide',()=>clearInterval(timer),{once:true});
 }
}
window.previewReady=true;
</script></body></html>
